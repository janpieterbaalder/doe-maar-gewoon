<title>Doe maar gewoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Instrument+Sans:wght@400;500&display=swap">
<style>
/* Layout: één stil scherm; het boek ligt midden op een egale ondergrond, bediening klein onderaan
   met een schuifbalk die hoofdstukken toont. Kleur: neutraal met een zweem van het paars uit de
   titelbalken van het boek. */
:root {
  --bg: #e6e4e7;
  --panel: #f3f2f4;
  --fg: #26222a;
  --muted: #6c6672;
  --accent: #5d2b61;
  --accent-text: #5d2b61;
  --on-accent: #f4eef5;
  --line: #cfccd2;
  --paper: #ebe8e2;
  --edge-1: #d7d2c9;
  --edge-2: #bdb7ad;
  --shadow-rgb: 38, 28, 42;
  --font-label: "Courier Prime", "Courier New", ui-monospace, monospace;
  --font-ui: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #19171b; --panel: #252229; --fg: #ece8ee; --muted: #9e97a4; --accent: #6e3473; --accent-text: #d6a9da;
    --on-accent: #f7f0f8; --line: #3a3540; --paper: #d8d4cc; --edge-1: #a9a399; --edge-2: #8a847a; --shadow-rgb: 0, 0, 0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #19171b; --panel: #252229; --fg: #ece8ee; --muted: #9e97a4; --accent: #6e3473; --accent-text: #d6a9da;
  --on-accent: #f7f0f8; --line: #3a3540; --paper: #d8d4cc; --edge-1: #a9a399; --edge-2: #8a847a; --shadow-rgb: 0, 0, 0;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.app > header { grid-row: 1; }
.app > .viewport { grid-row: 2; }
.app > footer { grid-row: 3; }

header, footer { position: relative; z-index: 3; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
/* snel twee keer tikken (iPad/iPhone) mag niet de hele pagina inzoomen */
header, footer, button, .toc { touch-action: manipulation; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 16px 4px; }
.label {
  font-family: var(--font-label); font-weight: 700; font-size: 13px; letter-spacing: .3em;
  text-transform: uppercase; background: var(--accent); color: var(--on-accent);
  padding: 6px 8px 5px 12px; line-height: 1;
}
.sub { color: var(--muted); font-size: 13px; }

.viewport {
  position: relative; z-index: 1; min-height: 0;
  overflow-x: hidden; overflow-x: clip; overflow-y: visible;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.shift { position: absolute; left: 50%; top: 50%; }
.book { position: absolute; inset: 0; transform-style: preserve-3d; }

.page, .face {
  background-color: var(--paper);
  background-repeat: no-repeat;
  background-size: var(--pw) var(--ph), var(--pw) var(--ph);
}
.page { position: absolute; top: 0; width: var(--pw); height: var(--ph); cursor: grab; }
.page.left { left: 0; background-image: var(--holes-l), var(--img); }
.page.right { left: calc(var(--pw) + var(--gap)); background-image: var(--holes-r), var(--img); }
.viewport.dragging .page { cursor: grabbing; }
.cast { position: absolute; inset: 0; pointer-events: none; }

.rotor { position: absolute; top: 0; left: calc(var(--pw) + var(--gap) / 2); width: 0; height: var(--ph); transform-style: preserve-3d; }
.seg { position: absolute; top: 0; left: var(--sw); width: var(--sw); height: 100%; transform-style: preserve-3d; transform-origin: 0 50%; }
.rotor > .seg { left: calc(var(--gap) / 2); }
.face {
  position: absolute; top: 0; left: 0; height: 100%; width: calc(var(--sw) + 1px);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.face.front { background-image: var(--holes-r), var(--img-front); background-position: calc(var(--sw) * var(--i) * -1) 0; }
.face.back {
  transform: rotateY(180deg);
  background-image: var(--holes-l), var(--img-back);
  background-position: calc((var(--pw) - var(--sw) * (var(--i) + 1) - 1px) * -1) 0;
}
.seg.last > .face { width: var(--sw); }
.seg.last > .face.back { background-position: calc((var(--pw) - var(--sw) * (var(--i) + 1)) * -1) 0; }
.shade { position: absolute; inset: 0; }
.binding { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

/* ---------- onderbalk ---------- */
footer { display: grid; gap: 2px; padding-block: 4px max(14px, env(safe-area-inset-bottom, 0px)); }
.caption {
  display: flex; justify-content: center; align-items: baseline; gap: 10px; min-height: 20px;
  font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden;
}
.caption .chap { overflow: hidden; text-overflow: ellipsis; }
.caption .pg, .tip .pg, .toc .pg, .reader .pgname {
  font-family: var(--font-label); font-variant-numeric: tabular-nums; letter-spacing: .02em;
}
.caption .pg { color: var(--fg); }
.bar { display: flex; align-items: center; gap: 4px; max-width: 920px; width: 100%; margin-inline: auto; }
.scrub { position: relative; flex: 1; min-width: 72px; height: 40px; touch-action: none; cursor: pointer; outline: none; }
.scrub .track { position: absolute; left: 8px; right: 8px; top: 50%; height: 2px; margin-top: -1px; background: var(--line); border-radius: 1px; }
.scrub .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 1px; }
.scrub .tick { position: absolute; top: -4px; width: 2px; height: 10px; margin-left: -1px; background: var(--muted); opacity: .5; border-radius: 1px; }
.scrub .thumb {
  position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--bg); transition: transform .15s ease;
}
.scrub:hover .thumb, .scrub.active .thumb { transform: scale(1.2); }
.scrub:focus-visible .thumb { outline: 2px solid var(--accent); outline-offset: 3px; }
.tip {
  position: absolute; bottom: 38px; transform: translateX(-50%); z-index: 5;
  background: var(--fg); color: var(--bg); font-size: 12px; line-height: 1.2;
  padding: 6px 9px; border-radius: 5px; white-space: nowrap; pointer-events: none;
}
.tip .pg { opacity: .7; margin-left: 8px; }

button {
  appearance: none; border: 0; background: transparent; color: var(--fg); font: inherit;
  width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%;
  cursor: pointer; transition: background-color .15s ease, opacity .15s ease;
}
button:hover { background: var(--line); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .3; cursor: default; background: transparent; }
button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- inhoudsopgave ---------- */
.toc {
  position: fixed; z-index: 8; left: var(--gutter-l); bottom: calc(var(--foot-h, 100px) + 6px);
  width: min(390px, calc(100vw - 32px)); max-height: min(68vh, 600px); overflow: auto; overscroll-behavior: contain;
  background: var(--panel); color: var(--fg); border-radius: 10px; padding-block: 6px 8px;
  box-shadow: 0 20px 50px -14px rgba(var(--shadow-rgb), .5), 0 0 0 1px rgba(var(--shadow-rgb), .06);
}
.toc h2 {
  margin: 0; padding: 10px 16px 8px; font: 700 12px/1 var(--font-label); letter-spacing: .26em;
  text-transform: uppercase; color: var(--muted);
}
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc .item {
  width: 100%; height: auto; border-radius: 0; display: flex; justify-content: space-between; align-items: baseline;
  gap: 16px; padding: 9px 16px; text-align: left; font-size: 14px; line-height: 1.3;
}
.toc .item .pg { color: var(--muted); font-size: 13px; flex: none; }
.toc .item:focus-visible { outline-offset: -2px; }
.toc .item[aria-current="true"] { color: var(--accent-text); font-weight: 500; }
.toc .item[aria-current="true"] .pg { color: var(--accent-text); }

/* ---------- leesweergave ---------- */
.reader { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.reader .top {
  display: flex; align-items: center; gap: 4px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) var(--gutter-r) 6px var(--gutter-l);
}
.reader .pgname { flex: 1; min-width: 0; text-align: center; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reader .pgname .chap { font-family: var(--font-ui); color: var(--muted); margin-left: 8px; }
.reader .scroller { overflow: auto; overscroll-behavior: contain; touch-action: pan-x pan-y pinch-zoom; }
.reader .sheet { box-sizing: border-box; min-width: 100%; width: max-content; padding: 8px var(--gutter-r) 96px var(--gutter-l); }
.reader img {
  display: block; margin-inline: auto; height: auto; background: var(--paper); aspect-ratio: 1545 / 1600;
  box-shadow: 0 10px 30px -12px rgba(var(--shadow-rgb), .45);
}
.reader .step {
  position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: 48px; height: 48px;
  background: var(--panel); box-shadow: 0 6px 20px -8px rgba(var(--shadow-rgb), .5);
}
.reader .step.prev { left: var(--gutter-l); }
.reader .step.next { right: var(--gutter-r); }

/* telefoon liggend: zo veel mogelijk boek */
@media (max-height: 520px) and (orientation: landscape) {
  header { display: none; }
  .caption { display: none; }
  footer { padding-block: 0 max(6px, env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 420px) {
  #fsBtn { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .scrub .thumb { transition: none; }
}
</style>

<div class="app">
  <header>
    <span class="label">Doe maar gewoon</span>

  </header>

  <div class="viewport" id="vp" role="region" aria-label="Boek">
    <div class="shift" id="shift">

        <div class="page left" id="pageL" hidden><div class="cast" id="castL"></div></div>
        <div class="page right" id="pageR" hidden><div class="cast" id="castR"></div></div>

  <footer id="foot">

      <button id="tocBtn" aria-label="Inhoudsopgave" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
      <button id="prev" aria-label="Vorige pagina"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

      <button id="fsBtn" aria-label="Volledig scherm"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>

</div>

<nav class="toc" id="toc" hidden aria-label="Inhoudsopgave">

<div class="reader" id="reader" hidden role="dialog" aria-label="Leesweergave">
  <div class="top">
    <button id="rClose" aria-label="Terug naar het boek"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

    <button id="rIn" aria-label="Inzoomen"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M8 10.5h5M10.5 8v5"/></svg></button>
  </div>
  <div class="scroller" id="rScroll"><div class="sheet"><img id="rImg" alt="" width="1545" height="1600"></div></div>
  <button class="step prev" id="rPrev" aria-label="Vorige pagina"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="step next" id="rNext" aria-label="Volgende pagina"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script>
(() => {
  // Pagina's in leesvolgorde: blad n heeft voorkant PAGES[2n] en achterkant PAGES[2n + 1].
  const PAGES = /*PAGES*/[];
  const HD = /*HD*/[];
  const N_LEAF = PAGES.length / 2;
  const LAST = N_LEAF;                       // spreads 0..N_LEAF (0 = dicht, voorkant)
  const ASPECT = 1545 / 1600;
  // Spiraal, gemeten aan de foto's: 24 dubbele draadlussen, steek 4,05% van de paginahoogte.
  const RINGS = 24, PITCH = 0.0405;
  const GAP = 0.03, HOLE_X = 0.0175;         // in paginabreedtes
  const STRIPS = 12;
  const A_AUTO = 32, A_DRAG = 34;            // buiging van het blad (graden aan de rand)
  // Hoofdstukken met het paginanummer zoals gedrukt in het boek; beeldindex = paginanummer + 1.
  const CHAPTERS = [
    ['Omslag', null, 0], ['Inhoud', null, 2], ['Voorwoord', 2], ['Hoe het vroeger was', 4],
    ['De eerste stap naar kleinschaligheid', 6], ['Inleiding tot de fusie', 10], ['Pioniersfase van De Baalderborg', 14],
    ['De fusie', 18], ['Mensen met mogelijkheden', 22], ['Integratie in de samenleving', 26],
    ["Van 'de klok rond' naar maatwerk", 28], ['Zelf zeggen wat je wilt', 32], ['In het zweet uws aanschijns…', 36],
    ['Als het leven nog voor je ligt, of bijna geleefd is', 40], ['Organisatie en communicatie', 44],
    ['De christelijke identiteit', 50], ['Hulp over de grens', 52], ['De smeerolie van Nieuw Baalderborg', 56],
    ['Nieuw Baalderborg anno nu', 58], ['Interview Jan Bast', 60], ['Overzicht bestuursleden 1993–2004', 67],
    ['Colofon', 68], ['Achterkant', null, 71],
  ].map(([title, p, i]) => ({ title, page: p, idx: i !== undefined ? i : p + 1 }));

  const $ = (id) => document.getElementById(id);
  const vp = $('vp'), shiftEl = $('shift'), book = $('book'), rotor = $('rotor'), binding = $('binding');
  const pageL = $('pageL'), pageR = $('pageR'), castL = $('castL'), castR = $('castR');
  const btnPrev = $('prev'), btnNext = $('next'), count = $('count'), chapEl = $('chap');
  const scrub = $('scrub'), fill = $('fill'), thumb = $('thumb'), tip = $('tip'), ticks = $('ticks');
  const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');

  let s = 0, focus = 'right', single = false, touched = false;
  let pw = 0, ph = 0, gap = 0, Dp = 1000;
  let shiftNow = 0, slide = null, turn = null, drag = null, raf = 0, lastT = 0;
  const queue = [];

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const url = (i) => `url("${PAGES[i]}")`;
  const ease = (k) => 0.5 - 0.5 * Math.cos(Math.PI * k);
  const smooth = (k) => k * k * (3 - 2 * k);

  // ---------- paginanamen en hoofdstukken ----------
  function pageLabel(i) {
    if (i === 0) return 'Omslag';
    if (i === PAGES.length - 1) return 'Achterkant';
    if (i === 1 || i === PAGES.length - 2) return 'Binnenkant omslag';
    if (i === 2) return 'Inhoud';
    return 'p. ' + (i - 1);
  }
  function spreadLabel(sp) {
    if (sp === 0) return 'Omslag';
    if (sp === LAST) return 'Achterkant';
    if (sp === 1) return 'Inhoud';
    if (sp === LAST - 1) return 'p. ' + (2 * sp - 2);
    return `p. ${2 * sp - 2}–${2 * sp - 1}`;
  }
  const spreadOf = (i) => (i % 2 ? (i + 1) / 2 : i / 2);
  const sideOf = (i) => (i % 2 ? 'left' : 'right');
  function chapterAt(i) {
    let c = CHAPTERS[0];
    for (const ch of CHAPTERS) if (ch.idx <= i) c = ch;
    return c;
  }
  const visibleIdx = () => single ? (focus === 'left' ? 2 * s - 1 : 2 * s) : (s < LAST ? 2 * s : 2 * s - 1);

  // ---------- bladstroken (gebogen blad) ----------
  const segs = [], shadeF = [], shadeB = [];
  let parent = rotor;
  for (let i = 0; i < STRIPS; i++) {
    const seg = document.createElement('div');
    seg.className = 'seg' + (i === STRIPS - 1 ? ' last' : '');
    const f = document.createElement('div'); f.className = 'face front'; f.style.setProperty('--i', i);
    const b = document.createElement('div'); b.className = 'face back'; b.style.setProperty('--i', i);
    const fs = document.createElement('div'); fs.className = 'shade'; f.append(fs);
    const bs = document.createElement('div'); bs.className = 'shade'; b.append(bs);
    seg.append(f, b); parent.append(seg);
    segs.push(seg); shadeF.push(fs); shadeB.push(bs);
    parent = seg;
  }

  // ---------- gaatjes in het papier ----------
  function holesSVG(side) {
    const W = 1000, H = W / ASPECT, pitch = PITCH * H;
    const sep = 0.28 * pitch, t = 0.0042 * H;
    const rx = 5.4, ry = sep / 2 + t * 0.95;
    const cx = side === 'r' ? HOLE_X * W : W - HOLE_X * W;
    let e = '';
    for (let r = 0; r < RINGS; r++) {
      const cy = H / 2 + (r - (RINGS - 1) / 2) * pitch;
      e += `<ellipse cx='${cx.toFixed(1)}' cy='${cy.toFixed(1)}' rx='${rx}' ry='${ry.toFixed(1)}'/>`;
    }
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${W} ${H.toFixed(1)}' preserveAspectRatio='none'>` +
      `<defs><radialGradient id='h' cx='.45' cy='.4' r='.7'><stop offset='0' stop-color='%23141113'/><stop offset='.75' stop-color='%23231e22'/><stop offset='1' stop-color='%23463e40'/></radialGradient></defs>` +
      `<g fill='url(%23h)' stroke='%23ffffff' stroke-opacity='.35' stroke-width='.8'>${e}</g></svg>`;
    return `url("data:image/svg+xml,${svg.replace(/</g, '%3C').replace(/>/g, '%3E')}")`;
  }
  book.style.setProperty('--holes-r', holesSVG('r'));
  book.style.setProperty('--holes-l', holesSVG('l'));

  // ---------- maatvoering ----------
  function layout() {
    const W = vp.clientWidth, H = vp.clientHeight;
    const compact = matchMedia('(max-height: 520px) and (orientation: landscape)').matches;
    single = W / H < 1.05 || W < 520;
    const availW = W - 32, availH = H * (compact ? 0.94 : 0.86);
    pw = Math.floor(single ? Math.min(availW, availH * ASPECT) : Math.min(availW / (2 + GAP), availH * ASPECT));
    pw = Math.max(pw, 120);
    ph = Math.round(pw / ASPECT);
    gap = Math.round(pw * GAP);
    Dp = pw * 4.5;
    const bw = pw * 2 + gap;
    for (const [k, v] of [['--pw', pw], ['--ph', ph], ['--gap', gap], ['--sw', pw / STRIPS]]) book.style.setProperty(k, v + 'px');
    Object.assign(shiftEl.style, { width: bw + 'px', height: ph + 'px', marginLeft: -bw / 2 + 'px', marginTop: -ph / 2 + 'px', perspective: Dp + 'px' });
    if (s === 0) focus = 'right';
    if (s === LAST) focus = 'left';
    document.documentElement.style.setProperty('--foot-h', $('foot').offsetHeight + 'px');
    drawBinding();
    if (turn) applyTurn(); else showSpread();
  }

  // ---------- spiraal ----------
  function drawBinding() {
    const bw = pw * 2 + gap, ax = pw + gap / 2, cy = ph / 2;
    const R = gap / 2 + HOLE_X * pw;
    const pitch = PITCH * ph, sep = 0.28 * pitch, t = Math.max(1.4, 0.0042 * ph);
    const BOW = 3;   // iets aangezette perspectief-boog, leest als draad i.p.v. streep
    let sh = '', wire = '', hi = '';
    for (let r = 0; r < RINGS; r++) {
      const yc = cy + (r - (RINGS - 1) / 2) * pitch;
      for (const off of [-sep / 2, sep / 2]) {
        const y0 = yc + off;
        let d = '', ds = '', dh = '';
        for (let j = 0; j <= 18; j++) {
          const f = Math.PI * j / 18, X = R * Math.cos(f), Z = R * Math.sin(f);
          const x = ax + X * Dp / (Dp - Z), y = cy + (y0 - cy) * Dp / (Dp - Z * BOW);
          d += (j ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
          ds += (j ? 'L' : 'M') + (x + Z * 0.55).toFixed(1) + ' ' + (y + Z * 0.38).toFixed(1);
          if (j >= 4 && j <= 12) dh += (j > 4 ? 'L' : 'M') + (x - t * 0.08).toFixed(1) + ' ' + (y - t * 0.2).toFixed(1);
        }

      `<stop offset="0" stop-color="#5f6267"/><stop offset=".2" stop-color="#c3c6ca"/><stop offset=".42" stop-color="#eef0f2"/>` +
      `<stop offset=".64" stop-color="#b0b4b9"/><stop offset=".86" stop-color="#868a90"/><stop offset="1" stop-color="#55585d"/></linearGradient>` +
      `<filter id="soft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="${(t * 0.7).toFixed(2)}"/></filter></defs>` +

  // ---------- statische pagina's ----------

  function openToc(byKeyboard) {

  function showReaderPage(i) {

    const a = document.createElement('span'); a.textContent = pageLabel(rIdx);

  rImg.addEventListener('dblclick', (e) => {
    const r = rScroll.getBoundingClientRect();
    setZoom(rZoom === 0 ? 2 : 0, e.clientX - r.left, e.clientY - r.top);
  });

  // ---------- volledig scherm ----------
  const fsBtn = $('fsBtn');
  if (!document.documentElement.requestFullscreen) fsBtn.hidden = true;
  fsBtn.addEventListener('click', () => {
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(() => { fsBtn.hidden = true; });
  });

  // ---------- toetsenbord ----------
  document.addEventListener('keydown', (e) => {
    if (!reader.hidden) {
      if (e.key === 'Escape') { rKeyboard = true; closeReader(); }
      else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); showReaderPage(rIdx + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); showReaderPage(rIdx - 1); }
      else if (e.key === '+' || e.key === '=') setZoom(rZoom + 1);
      else if (e.key === '-') setZoom(rZoom - 1);
      return;
    }
    if (!toc.hidden && e.key === 'Escape') { closeToc(); tocBtn.focus(); return; }
    if (e.target.closest && e.target.closest('button, .toc') && (e.key === ' ' || e.key === 'Enter')) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
    else if (e.key === 'Home') { e.preventDefault(); jumpTo(0); }
    else if (e.key === 'End') { e.preventDefault(); jumpTo(LAST); }
  });

  new ResizeObserver(() => { layout(); if (!reader.hidden) setZoom(rZoom); }).observe(vp);
  layout();
})();
</script>
